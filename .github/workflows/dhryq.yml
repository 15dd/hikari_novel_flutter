name: Build Signed APK Follow Upstream Version

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-tags: "true"

      - name: Setup Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read version from pubspec.yaml
        id: get_version
        run: |
          VERSION_RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SEM_VER=${VERSION_RAW%+*}
          NEW_TAG="v$SEM_VER"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Parsed version: $SEM_VER"

      - name: Check remote tag exists
        id: check_tag
        env:
          NEW_TAG: ${{ steps.get_version.outputs.NEW_TAG }}
        run: |
          if git ls-remote --tags origin "${NEW_TAG}" | grep -q "${NEW_TAG}$"; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "Remote tag ${NEW_TAG} already exists, skip release creation."
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "Remote tag ${NEW_TAG} not found, will create release."
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode JKS keystore secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks

      - name: Install Flutter stable
        run: |
          git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Flutter Doctor
        run: flutter doctor

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed release APK
        env:
          STORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-output
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Tag & Publish Release
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.NEW_TAG }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
