name: Build Signed APK Follow Upstream Version

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-tags: "true"

      - name: Setup Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect trigger source & get version
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NEW_TAG=${GITHUB_REF#refs/tags/}
            echo "TRIGGER_BY_TAG=true" >> $GITHUB_OUTPUT
            echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          else
            VERSION_RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
            SEM_VER=${VERSION_RAW%+*}
            NEW_TAG="v$SEM_VER"
            echo "TRIGGER_BY_TAG=false" >> $GITHUB_OUTPUT
            echo "RAW_VERSION=$VERSION_RAW"
            echo "SEM_VERSION=$SEM_VER"
            echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Create & push new tag
        if: ${{ steps.get_version.outputs.TRIGGER_BY_TAG == 'false' }}
        env:
          NEW_TAG: ${{ steps.get_version.outputs.NEW_TAG }}
        run: |
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, skip release, only build artifact."
            exit 0
          fi
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode JKS keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks

      - name: Install Flutter stable
        run: |
          git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Flutter Doctor
        run: flutter doctor

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Signed Release APK
        env:
          STORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-output
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        if: ${{ steps.get_version.outputs.TRIGGER_BY_TAG == 'true' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.NEW_TAG }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
