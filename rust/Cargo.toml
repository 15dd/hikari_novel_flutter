[package]
name = "hikari_http"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
wreq = { version = "=0.16.1", default-features = false, features = ["cookies", "gzip", "brotli", "deflate", "tokio-rt", "webpki-roots"] }
wreq-util = "=0.2.0"
anyhow = "1"
cookie = "0.18.1"
once_cell = "1.19"
url = "2.5.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
